[alias "lola"]
    command = "log --graph --decorate --pretty=oneline --abbrev-commit --all"
    description = "Exibe o log em formato de árvore decorada."
[alias "ci"]
    command = "!f() { git commit -m \"$*\"; }; f"
    description = "Atalho rápido para commit com mensagem."
[alias "co"]
    command = "checkout"
    description = "Atalho para checkout."
[alias "cm"]
    command = "checkout master"
    description = "Atalho rápido para voltar à master."
[alias "cb"]
    command = "checkout -b"
    description = "Atalho para criar nova branch e fazer checkout."
[alias "st"]
    command = "status -sb"
    description = "Exibe o status de forma resumida e com branch info."
[alias "sf"]
    command = "show --name-only"
    description = "Mostra os arquivos modificados de um commit."
[alias "lg"]
    command = "log --pretty=format:'%Cred%h%Creset %C(bold)%cr%Creset %Cgreen<%an>%Creset %s' --max-count=30"
    description = "Exibe o log de forma super limpa, colorida e customizada."
[alias "incoming"]
    command = "!(git fetch --quiet && git log --pretty=format:'%C(yellow)%h %C(white)- %C(red)%an %C(white)- %C(cyan)%d%Creset %s %C(white)- %ar%Creset' ..@{u})"
    description = "Verifica commits no remoto que ainda não foram baixados (incoming)."
[alias "outgoing"]
    command = "!(git fetch --quiet && git log --pretty=format:'%C(yellow)%h %C(white)- %C(red)%an %C(white)- %C(cyan)%d%Creset %s %C(white)- %ar%Creset' @{u}..)"
    description = "Verifica commits locais que ainda não foram enviados (outgoing)."
[alias "unstage"]
    command = "reset HEAD --"
    description = "Remove arquivos do stage (desfaz o git add)."
[alias "undo"]
    command = "checkout --"
    description = "Desfaz as modificações locais de um arquivo."
[alias "rollback"]
    command = "reset --soft HEAD~1"
    description = "Desfaz o último commit mantendo as modificações locais."
[alias "pu"]
    command = "push origin HEAD"
    description = "Push rápido para a origin baseada na branch atual."
